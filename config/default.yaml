ecosystems:
  - npm
  - pypi

# Number of top packages to ingest per ecosystem (smoke test: 200).
top_n: 2000

github_token_env: GITHUB_TOKEN

http:
  timeout_s: 20
  cache_ttl_h: 24
  rate_limit_qps: 5
  user_agent: "MaintainerWatch/0.1 (+https://example.org/maintainerwatch)"

# Signal weights used by the 0-100 explainable score.
weights:
  publisher_change: 30
  bus_factor: 20
  account_age: 15
  release_anomaly: 15
  signing_gap: 10
  typosquat: 10

# Confidence levels accepted for identity-gated signals.
min_identity_confidence: medium

model_version: "0.1.0"

osint:
  # Minimal, passive, role-related sources only.
  keybase: true
  github_email: true
  pypi_provenance: true
