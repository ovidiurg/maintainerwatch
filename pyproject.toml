[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainerwatch"
version = "0.4.10"
description = "Open maintainer-level software supply-chain risk intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "MaintainerWatch contributors" }]
keywords = ["supply-chain", "security", "osint", "sbom", "open-source"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "polars>=0.20",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
release = ["build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/ovidiurg/maintainerwatch"
Repository = "https://github.com/ovidiurg/maintainerwatch"
Issues = "https://github.com/ovidiurg/maintainerwatch/issues"

[project.scripts]
mw = "mw.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mw = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
