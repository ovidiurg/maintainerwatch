[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainerwatch"
version = "0.1.0"
description = "Open maintainer-level software supply-chain risk intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "MaintainerWatch contributors" }]
keywords = ["supply-chain", "security", "osint", "sbom", "open-source"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "polars>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mw = "mw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
