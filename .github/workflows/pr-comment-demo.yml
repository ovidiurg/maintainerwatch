name: MaintainerWatch PR comment demo

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          index-path: ${{ github.workspace }}/.github/testdata/maintainerwatch-index.json
          base-ref: origin/${{ github.base_ref }}
          comment: "true"
          upload-sarif: "false"
          fail-on: "high"
