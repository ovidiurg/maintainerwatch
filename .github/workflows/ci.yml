name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_smoke:
        description: "Run the Docker smoke test"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'config/**'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" detect-secrets
      - name: Unit and API tests
        run: python -m pytest --cov=src/mw --cov-config=.coveragerc --cov-fail-under=75
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Secret scan
        run: |
          detect-secrets scan --all-files \
            --exclude-files '\.git/.*' \
            --exclude-files '\.venv/.*' \
            --exclude-files 'dist/.*' \
            --exclude-files 'data/.*' \
            --exclude-files '\.pytest_cache/.*' \
            --exclude-files 'validation/v1/manifest\.json' > /tmp/secrets.json
          python - <<'PY'
          import json
          findings = json.load(open('/tmp/secrets.json')).get('results', {})
          if findings:
              raise SystemExit(f'secret findings: {findings}')
          PY

  docker:
    needs: [changes, test]
    if: >
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.docker_smoke) ||
        (github.event_name == 'pull_request' && needs.changes.outputs.app == 'true' && needs.test.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker smoke test
        run: bash scripts/docker_smoke.sh
